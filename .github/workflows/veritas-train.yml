# Entraînement de Veritas sur Modal (ADR-0009).
# Deux façons de lancer :
# - à la main (Actions → Run workflow) ;
# - par un commit sur main qui modifie ml/train/requests/run.json (paramètres dans le fichier).
# Secrets du dépôt : MODAL_TOKEN_ID, MODAL_TOKEN_SECRET, ANTHROPIC_API_KEY (corpus),
# PANGRAM_API_KEY (banc d'essai du fournisseur, étape benchmark).
name: Entraînement Veritas (Modal)

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Étape : all, corpus, train, deploy (inférence), benchmark (fournisseur externe)"
        type: choice
        options: [all, corpus, train, deploy, benchmark]
        default: all
      run:
        description: "pilot (essai isolé) ou v1 (corpus et modèles 0.1, jeu de test gelé)"
        type: choice
        options: [pilot, v1]
        default: pilot
      languages:
        description: "Langues, séparées par des virgules"
        default: "fr,en"
      train_size:
        description: "Textes humains pour l'entraînement et la calibration, par langue"
        default: "4400"
      test_size:
        description: "Textes humains du jeu de test, par langue"
        default: "1000"
      use_encoder:
        description: "Entraîner la couche 2 (GPU)"
        type: boolean
        default: true
      provider:
        description: "Benchmark : fournisseur comparé à Veritas"
        type: choice
        options: [pangram]
        default: pangram
      bench_human:
        description: "Benchmark : textes humains du jeu de test, par langue"
        default: "500"
      bench_ai:
        description: "Benchmark : textes générés du jeu de test, par langue"
        default: "100"
  push:
    branches: [main]
    paths: ["ml/train/requests/run.json"]

permissions:
  contents: read

concurrency:
  group: veritas-train
  cancel-in-progress: false

jobs:
  modal:
    name: Modal (Veritas)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Écriture : seulement pour pousser les sorties de v1 sur une branche dédiée (étape finale).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Paramètres : saisis à la main, ou lus dans la demande commitée. Chaque valeur est
      # vérifiée avant usage (aucune valeur libre n'atteint une commande).
      - name: Paramètres
        id: p
        env:
          EVENT: ${{ github.event_name }}
          IN_STAGE: ${{ inputs.stage }}
          IN_RUN: ${{ inputs.run }}
          IN_LANGUAGES: ${{ inputs.languages }}
          IN_TRAIN: ${{ inputs.train_size }}
          IN_TEST: ${{ inputs.test_size }}
          IN_ENCODER: ${{ inputs.use_encoder }}
          IN_PROVIDER: ${{ inputs.provider }}
          IN_BENCH_HUMAN: ${{ inputs.bench_human }}
          IN_BENCH_AI: ${{ inputs.bench_ai }}
        run: |
          if [ "$EVENT" = "push" ]; then
            f=ml/train/requests/run.json
            stage=$(jq -r '.stage' "$f"); run=$(jq -r '.run' "$f")
            languages=$(jq -r '.languages' "$f"); train=$(jq -r '.train_size' "$f")
            test=$(jq -r '.test_size' "$f"); encoder=$(jq -r '.use_encoder' "$f")
            provider=$(jq -r '.provider // "pangram"' "$f")
            bench_human=$(jq -r '.bench_human // 500' "$f"); bench_ai=$(jq -r '.bench_ai // 100' "$f")
          else
            stage=$IN_STAGE; run=$IN_RUN; languages=$IN_LANGUAGES
            train=$IN_TRAIN; test=$IN_TEST; encoder=$IN_ENCODER
            provider=$IN_PROVIDER; bench_human=$IN_BENCH_HUMAN; bench_ai=$IN_BENCH_AI
          fi
          [[ "$stage" =~ ^(all|corpus|train|deploy|benchmark)$ ]] || { echo "stage invalide"; exit 1; }
          [[ "$provider" =~ ^(pangram)$ ]] || { echo "provider invalide"; exit 1; }
          [[ "$bench_human" =~ ^[0-9]{1,4}$ && "$bench_ai" =~ ^[0-9]{1,4}$ ]] || { echo "tailles du benchmark invalides"; exit 1; }
          [[ "$run" =~ ^(pilot|v1)$ ]] || { echo "run invalide"; exit 1; }
          [[ "$languages" =~ ^(fr|en)(,(fr|en))?$ ]] || { echo "languages invalide"; exit 1; }
          [[ "$train" =~ ^[0-9]{1,5}$ && "$test" =~ ^[0-9]{1,5}$ ]] || { echo "tailles invalides"; exit 1; }
          [[ "$encoder" =~ ^(true|false)$ ]] || { echo "use_encoder invalide"; exit 1; }
          if [ "$encoder" = true ]; then flag=--use-encoder; else flag=--no-use-encoder; fi
          {
            echo "stage=$stage"; echo "run=$run"; echo "languages=$languages"
            echo "train=$train"; echo "test=$test"; echo "encoder_flag=$flag"
            echo "provider=$provider"; echo "bench_human=$bench_human"; echo "bench_ai=$bench_ai"
          } >> "$GITHUB_OUTPUT"
          echo "Étape $stage, essai $run, langues $languages, tailles $train / $test, $flag"

      # Arrêt immédiat, avec un message clair, si un secret du dépôt manque.
      - name: Secrets du dépôt
        env:
          STAGE: ${{ steps.p.outputs.stage }}
          HAS_MODAL_ID: ${{ secrets.MODAL_TOKEN_ID != '' }}
          HAS_MODAL_SECRET: ${{ secrets.MODAL_TOKEN_SECRET != '' }}
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_PANGRAM: ${{ secrets.PANGRAM_API_KEY != '' }}
        run: |
          missing=()
          [ "$HAS_MODAL_ID" = true ] || missing+=(MODAL_TOKEN_ID)
          [ "$HAS_MODAL_SECRET" = true ] || missing+=(MODAL_TOKEN_SECRET)
          if [ "$STAGE" = all ] || [ "$STAGE" = corpus ]; then
            [ "$HAS_ANTHROPIC" = true ] || missing+=(ANTHROPIC_API_KEY)
          fi
          if [ "$STAGE" = benchmark ]; then
            [ "$HAS_PANGRAM" = true ] || missing+=(PANGRAM_API_KEY)
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Secrets absents du dépôt : ${missing[*]}. Les ajouter dans Settings → Secrets and variables → Actions → Repository secrets."
            exit 1
          fi
          echo "Secrets présents."

      # Espaces et retours à la ligne collés avec les valeurs retirés ; préfixes Modal vérifiés,
      # clé Claude essayée auprès de l'API. Les valeurs ne sont jamais affichées (masquées) ; les
      # valeurs nettoyées servent aux étapes suivantes.
      - name: Format des secrets
        env:
          STAGE: ${{ steps.p.outputs.stage }}
          RAW_MODAL_ID: ${{ secrets.MODAL_TOKEN_ID }}
          RAW_MODAL_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          RAW_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
          RAW_PANGRAM: ${{ secrets.PANGRAM_API_KEY }}
        run: |
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          id=$(clean "$RAW_MODAL_ID"); secret=$(clean "$RAW_MODAL_SECRET")
          key=$(clean "$RAW_ANTHROPIC"); pangram=$(clean "$RAW_PANGRAM")
          for v in "$id" "$secret" "$key" "$pangram"; do [ -n "$v" ] && echo "::add-mask::$v"; done
          bad=()
          [[ "$id" == ak-* ]] || bad+=("MODAL_TOKEN_ID (doit commencer par ak-)")
          [[ "$secret" == as-* ]] || bad+=("MODAL_TOKEN_SECRET (doit commencer par as-)")
          if [ "$STAGE" = all ] || [ "$STAGE" = corpus ]; then
            # Vérification auprès de l'API (gratuite, aucun texte généré) plutôt que par préfixe :
            # plusieurs formats de clé existent.
            code=$(curl -s -o /dev/null -w '%{http_code}' https://api.anthropic.com/v1/models \
              -H "x-api-key: $key" -H "anthropic-version: 2023-06-01")
            [ "$code" = 200 ] || bad+=("ANTHROPIC_API_KEY refusée par l'API Claude (HTTP $code)")
          fi
          if [ ${#bad[@]} -gt 0 ]; then
            for b in "${bad[@]}"; do echo "::error::Secret refusé ou mal formé : $b"; done
            exit 1
          fi
          {
            echo "MODAL_TOKEN_ID=$id"; echo "MODAL_TOKEN_SECRET=$secret"
            echo "ANTHROPIC_API_KEY_CLEAN=$key"; echo "PANGRAM_API_KEY_CLEAN=$pangram"
          } >> "$GITHUB_ENV"
          echo "Format des secrets correct."

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --frozen

      - name: Secret Modal de l'API Claude
        if: steps.p.outputs.stage == 'all' || steps.p.outputs.stage == 'corpus'
        run: uv run --no-sync modal secret create altydetect-anthropic ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY_CLEAN" --force

      - name: Secret Modal de l'API Pangram
        if: steps.p.outputs.stage == 'benchmark'
        run: uv run --no-sync modal secret create altydetect-pangram PANGRAM_API_KEY="$PANGRAM_API_KEY_CLEAN" --force

      # Banc d'essai interne (ADR-0001, condition 2) : fournisseur et Veritas sur un échantillon
      # du jeu gelé detection-v1. Plafond de mots vérifié avant tout appel au fournisseur.
      - name: Banc d'essai du fournisseur
        if: steps.p.outputs.stage == 'benchmark'
        timeout-minutes: 90
        env:
          PYTHONUNBUFFERED: "1"
          PROVIDER: ${{ steps.p.outputs.provider }}
          LANGUAGES: ${{ steps.p.outputs.languages }}
          HUMANS: ${{ steps.p.outputs.bench_human }}
          AIS: ${{ steps.p.outputs.bench_ai }}
        run: >-
          uv run --no-sync modal run ml/eval/detection/provider_benchmark.py
          --provider "$PROVIDER" --languages "$LANGUAGES" --humans "$HUMANS" --ais "$AIS"
          --out ml/train/out

      - name: Corpus, entraînement, évaluation
        if: steps.p.outputs.stage != 'deploy' && steps.p.outputs.stage != 'benchmark'
        # Coupure de l'étape (et de l'application Modal éphémère) : 120 min pour le pilote (le lot
        # Claude seul peut prendre près d'une heure), 330 min pour v1. Un seul GPU à la fois.
        timeout-minutes: ${{ steps.p.outputs.run == 'pilot' && 120 || 330 }}
        env:
          # Suivi visible au fil de l'eau (sans cela, la sortie Python reste en mémoire tampon).
          PYTHONUNBUFFERED: "1"
          STAGE: ${{ steps.p.outputs.stage }}
          RUN: ${{ steps.p.outputs.run }}
          LANGUAGES: ${{ steps.p.outputs.languages }}
          TRAIN: ${{ steps.p.outputs.train }}
          TEST: ${{ steps.p.outputs.test }}
          ENCODER_FLAG: ${{ steps.p.outputs.encoder_flag }}
        run: >-
          uv run --no-sync modal run ml/train/pipeline.py
          --stage "$STAGE" --run "$RUN" --languages "$LANGUAGES"
          --train-size "$TRAIN" --test-size "$TEST" "$ENCODER_FLAG" --out ml/train/out

      - name: Déployer l'inférence de la couche 2 (mise à l'échelle jusqu'à zéro)
        if: steps.p.outputs.stage == 'deploy'
        run: uv run --no-sync modal deploy services/veritas/modal/encoder_app.py

      - name: Manifestes, paquets et rapports (sans texte)
        if: always() && steps.p.outputs.stage != 'deploy'
        uses: actions/upload-artifact@v4
        with:
          name: veritas-${{ steps.p.outputs.run }}-${{ steps.p.outputs.stage }}-${{ github.run_id }}
          path: ml/train/out/
          if-no-files-found: warn
          retention-days: 30

      # Sorties de v1 (manifestes, paquets, rapports : aucun texte) poussées sur une branche
      # `ml/sorties-v1-<run>`, d'où une PR les range (jeu de test gelé, fiches des modèles).
      # L'artefact reste disponible 30 jours.
      - name: Sorties sur une branche (v1, benchmark)
        if: always() && steps.p.outputs.stage != 'deploy' && (steps.p.outputs.run == 'v1' || steps.p.outputs.stage == 'benchmark')
        env:
          RUN_ID: ${{ github.run_id }}
          KIND: ${{ steps.p.outputs.stage == 'benchmark' && 'benchmark' || 'v1' }}
        run: |
          if [ -z "$(ls -A ml/train/out 2>/dev/null)" ]; then echo "Aucune sortie."; exit 0; fi
          dest="ml/train/runs/$RUN_ID"
          mkdir -p "$dest" && cp -r ml/train/out/. "$dest/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "ml/sorties-$KIND-$RUN_ID"
          git add "$dest"
          git commit -q -m "ml: sorties du run $KIND $RUN_ID (sans texte)"
          git push origin "ml/sorties-$KIND-$RUN_ID"
          echo "Sorties poussées sur la branche ml/sorties-$KIND-$RUN_ID"
