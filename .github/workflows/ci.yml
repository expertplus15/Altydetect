# Intégration continue : vérifications JS et Python, images Docker, dépendances locales.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types et tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: altydetect
          POSTGRES_PASSWORD: altydetect
          POSTGRES_DB: altydetect
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U altydetect" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://altydetect:altydetect@localhost:5432/altydetect
      SHADOW_DATABASE_URL: postgresql://altydetect:altydetect@localhost:5432/altydetect_shadow
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --frozen
      - name: Appliquer les migrations
        run: pnpm -C apps/web db:migrate
      - name: Vérifier que les migrations correspondent au schéma
        run: |
          PGPASSWORD=altydetect psql -h localhost -U altydetect -d altydetect -c "CREATE DATABASE altydetect_shadow"
          pnpm -C apps/web exec prisma migrate diff \
            --from-migrations ../../infra/migrations --to-schema prisma/schema.prisma --exit-code
      - run: pnpm check
      - name: Vérifier que les modèles Pydantic d'Indexa suivent les contrats zod
        run: pnpm contracts:check
      # Comme sur Vercel : le build ne doit dépendre ni de la base ni de Redis.
      - name: Construire sans base ni Redis (comme Vercel)
        run: pnpm build
        env:
          DATABASE_URL: ""
          REDIS_URL: ""

  e2e:
    name: Parcours de bout en bout (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: altydetect
          POSTGRES_PASSWORD: altydetect
          POSTGRES_DB: altydetect
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U altydetect" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://altydetect:altydetect@localhost:5432/altydetect
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --frozen
      - run: pnpm -C apps/web db:migrate
      - name: Construire l'application (Stripe et Claude simulés, aucune clé réelle)
        run: pnpm -C apps/web build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3200
      - run: pnpm -C apps/web exec playwright install --with-deps chromium
      - run: pnpm -C apps/web test:e2e
      - name: Traces en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  docker:
    name: Images Docker et docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire les images des services
        run: |
          docker build -f services/veritas/Dockerfile -t altydetect-veritas .
          docker build -f services/indexa/Dockerfile -t altydetect-indexa .
      - name: Vérifier /health dans les conteneurs
        run: |
          docker run -d --name veritas -p 8001:8001 altydetect-veritas
          docker run -d --name indexa -p 8002:8002 altydetect-indexa
          for port in 8001 8002; do
            for i in $(seq 1 30); do curl -fsS "http://localhost:$port/health" && break; sleep 1; done
            curl -fsS "http://localhost:$port/health" | grep -q '"status":"ok"'
          done
      - name: Démarrer PostgreSQL + pgvector et Redis
        run: docker compose up -d --wait
      - name: Vérifier pgvector et Redis
        run: |
          docker compose exec -T postgres psql -U altydetect -d altydetect -tAc \
            "SELECT extname FROM pg_extension WHERE extname = 'vector'" | grep -qx vector
          docker compose exec -T redis redis-cli ping | grep -qx PONG
      - name: Journaux en cas d'échec
        if: failure()
        run: |
          docker logs veritas || true
          docker logs indexa || true
          docker compose logs
