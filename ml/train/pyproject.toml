[project]
name = "altydetect-ml-train"
version = "0.0.0"
description = "Fine-tuning et calibration des modèles Veritas."
requires-python = ">=3.12,<3.13"
dependencies = [
    "veritas",
    "modal>=1.0",
    "numpy>=2.0",
    "scikit-learn>=1.5",
]

[tool.uv]
package = false

[tool.uv.sources]
veritas = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../corpus", "../eval"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
allowed-confusables = ["’", "\u00a0", "\u202f"]
