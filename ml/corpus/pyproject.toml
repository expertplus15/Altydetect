[project]
name = "altydetect-ml-corpus"
version = "0.0.0"
description = "Scripts de constitution des corpus (jamais de données brutes commitées)."
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
allowed-confusables = ["’", "\u00a0", "\u202f"]
