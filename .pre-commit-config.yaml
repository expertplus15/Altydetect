# Hooks locaux : ils utilisent les versions fixées par pnpm-lock.yaml et uv.lock.
# Installation : uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --check --ignore-unknown
        language: system
        types: [text]
        exclude: ^(pnpm-lock\.yaml|uv\.lock|CLAUDE\.md)$
      - id: eslint
        name: eslint
        entry: pnpm exec eslint --no-warn-ignored
        language: system
        files: \.(ts|tsx|js)$
      - id: lint-vocabulary
        name: lint-vocabulary
        entry: pnpm lint:vocabulary
        language: system
        pass_filenames: false
        files: ^(apps/web/messages|apps/web/app|docs/public)/
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: mypy-veritas
        name: mypy (veritas)
        entry: bash -c 'cd services/veritas && uv run mypy'
        language: system
        pass_filenames: false
        files: ^services/veritas/
      - id: mypy-indexa
        name: mypy (indexa)
        entry: bash -c 'cd services/indexa && uv run mypy'
        language: system
        pass_filenames: false
        files: ^services/indexa/
