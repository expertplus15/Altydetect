# Seuils de notation de Veritas (ADR-0008, CLAUDE.md §5).
# Relus à chaque modification du fichier : aucun redéploiement nécessaire.
# Valeurs provisoires jusqu'à la calibration sur le jeu de test gelé ; tout changement est
# consigné dans docs/models/CHANGELOG.md.
version: 1

# En dessous de ce nombre de mots : erreur TEXT_TOO_SHORT, jamais de score.
min_words: 150

# Bandes, sur la probabilité calibrée (phrase ou document).
bands:
  likely_ai: 0.70 # probabilité ≥ seuil → « Probablement IA »
  likely_human: 0.30 # probabilité ≤ seuil → « Probablement humain »

# Seuil « Probablement IA » propre à un modèle Veritas (ADR-0013), par référence : choisi sur
# la partition de calibration, entre 0,70 et 0,95 (ADR-0017), puis mesuré sur un jeu de test gelé.
# Les autres seuils, et ceux des fournisseurs, restent ceux de `bands`.
models:
  # Run 44352541251 (ADR-0015) : 0,45 % de faux positifs en calibration ; portes franchies.
  # Même valeur que `bands` : l'inscrire atteste qu'un seuil propre a été choisi.
  VRT-DET-EN-0.2: { likely_ai: 0.70 }
  # Run 44643189844 (ADR-0017) : 0,40 % de faux positifs en calibration sur la grille 0,70-0,95 ;
  # mesure unique sur detection-v4 : 0,45 % de faux positifs, portes franchies.
  VRT-DET-FR-0.6: { likely_ai: 0.93 }

# Confiance : écart entre la probabilité du document et 0,5.
confidence:
  high_margin: 0.35
  medium_margin: 0.20
  # En dessous de ce nombre de mots, la confiance ne dépasse pas « medium ».
  min_words_for_high: 300
