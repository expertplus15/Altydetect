# Règles de l'aiguillage (services/veritas/router.py, ADR-0008, CLAUDE.md §4.4).
# Relues à chaque modification du fichier : aucun redéploiement nécessaire.
version: 1

# Accord Veritas / fournisseur externe sur un segment. Sans objet depuis ADR-0015 (aucun
# fournisseur en production) ; gardé pour les mesures ponctuelles d'un fournisseur.
agreement:
  threshold: 0.85
  # TODO : taille d'échantillon minimale avant de juger un segment (à confirmer).
  min_comparisons: 200

# Mode fantôme : Veritas tourne en arrière-plan quand l'externe répond seul (ADR-0010).
# Désactivé par ADR-0015 : sans fournisseur externe, il n'y a rien à comparer.
shadow:
  enabled: false
  sample_rate: 0.1 # part des requêtes comparées, de 0 à 1

# Phase 3 : si aucun fournisseur externe ne répond, la détection est indisponible ; Veritas
# ne répond jamais seul aux utilisateurs avant d'avoir franchi la porte d'accord (ADR-0010).
veritas_fallback: false

# Premier segment qui correspond. Champs : languages, plans, min_words, max_words (facultatifs) ;
# serve : external | veritas | both | closed (langue non servie, UNSUPPORTED_LANGUAGE) ;
# primary (pour both) : external | veritas ;
# Langue non ouverte (ADR-0015 §1) : serve: external ; sans fournisseur, DETECTION_UNAVAILABLE.
# Ouverture (ADR-0016) : la langue passe à serve: veritas, veritas_min_confidence: low, les
# autres et default à serve: closed.
# veritas_min_confidence (pour veritas) : high | medium | low.
segments:
  - name: fr
    languages: [fr]
    serve: external
  - name: en
    languages: [en]
    serve: external

# Si aucun segment ne correspond.
default:
  name: other
  serve: external
